name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
         node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint || true
      - name: Create TLS dummy files
        run: |
          mkdir -p src/config/resources/tls
          echo "dummy" > src/config/resources/tls/key.pem
          echo "dummy" > src/config/resources/tls/certificate.crt
      - name: Run tests
        run: pnpm test
